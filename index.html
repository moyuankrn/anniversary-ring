<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f1ea">
  <title>纪念日 · Anniversary Ring</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="site">
    <header class="site-head"><a class="brand" href="./"><span class="brand-symbol">◎</span><span>ANNIVERSARY <small>RING</small></span></a><span class="head-note">把重要的日子，放在看得见的地方。</span><span id="today"></span></header>
    <main>
      <section class="intro"><div class="intro-index">01 / DAYS TO REMEMBER</div><h1>日子会往前走，<br><em>有些值得慢慢数。</em></h1><p>每月、每年，或者只发生一次。写下来，离下一次还有几天，就在这里看。</p></section>
      <section class="feature" id="feature" aria-label="主纪念日"></section>
      <section class="events-section"><div class="section-head"><div><span>02 / YOUR DATES</span><h2>所有纪念日</h2></div><button type="button" class="add-button" id="add-event">＋ 新纪念日</button></div><div id="events" class="events"></div></section>
      <section class="storage-note"><span>◌</span><div><b>只留在这台浏览器</b><p>记录存在本地浏览器里，不会上传。换设备前，可以下载备份。</p></div><div class="storage-actions"><button type="button" id="export-data">导出备份</button><label for="import-data">导入备份</label><input id="import-data" type="file" accept="application/json,.json" hidden></div></section>
    </main>
    <footer><span>ANNIVERSARY RING · 一个独立的小工具</span><span>日期会按照你设备的本地日历计算。</span></footer>
  </div>
  <dialog id="editor"><form id="event-form" method="dialog"><div class="dialog-head"><span>ADD A DATE</span><button type="button" id="close-editor" aria-label="关闭">×</button></div><h2 id="dialog-title">记下一个日子</h2><label>这个日子叫什么<input name="name" maxlength="40" required placeholder="例如：第一次见面"></label><label>发生在哪一天<input name="date" type="date" required></label><fieldset><legend>怎么算</legend><label><input type="radio" name="repeat" value="monthly"> 每月</label><label><input type="radio" name="repeat" value="yearly" checked> 每年</label><label><input type="radio" name="repeat" value="once"> 只一次</label></fieldset><label class="main-choice"><input name="main" type="checkbox"> 放在首页的大圆环上</label><p id="form-error" role="alert"></p><div class="dialog-actions"><button type="button" class="delete-button" id="delete-event">删除</button><button type="submit" class="save-button">保存这个日子</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
